<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"><h:head><title>Специальные операции</title></h:head><h:body><h1>Специальные операции</h1><h:link value="К списку" outcome="index.xhtml"/><h:messages style="color:red"/><h:outputText value="#{dragonBean.result}"/><h:form><h2>Удалить по возрасту</h2><h:inputText value="#{dragonBean.age}"/><h:commandButton value="Удалить" action="#{dragonBean.removeAge}"/></h:form><h:form><h2>Средний размах крыльев</h2><h:commandButton value="Рассчитать" action="#{dragonBean.average}"/></h:form><h:form><h2>Найти по началу имени</h2><h:inputText value="#{dragonBean.prefix}"/><h:commandButton value="Найти" action="#{dragonBean.starts}"/><h:dataTable value="#{dragonBean.results}" var="d"><h:column>#{d.id}</h:column><h:column>#{d.name}</h:column></h:dataTable></h:form><h:form><h2>Убить дракона или создать команду</h2><h:outputText value="ID дракона: "/><h:inputText value="#{dragonBean.teamDragonId}"/><h:commandButton value="Убить" action="#{dragonBean.kill}"/><br/><h:outputText value="Название команды: "/><h:inputText value="#{dragonBean.teamName}"/><h:commandButton value="Создать команду" action="#{dragonBean.addTeam}"/></h:form></h:body></html>
