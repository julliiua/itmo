<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core"><h:head><title>Связанные объекты</title></h:head><h:body><h1>Пещеры и люди</h1><h:link value="К списку" outcome="index.xhtml"/><h:messages style="color:red"/><h2>Новая пещера</h2><h:form><h:outputText value="Сокровища: "/><h:inputText value="#{dragonBean.treasures}"/><h:commandButton value="Создать" action="#{dragonBean.addCave}"/></h:form><h2>Новый человек</h2><h:form><h:panelGrid columns="2"><h:outputText value="Имя"/><h:inputText value="#{dragonBean.person.name}" required="true"/><h:outputText value="Цвет глаз"/><h:selectOneMenu value="#{dragonBean.person.eyeColor}" required="true"><f:selectItems value="#{dragonBean.colors}"/></h:selectOneMenu><h:outputText value="Цвет волос"/><h:selectOneMenu value="#{dragonBean.person.hairColor}"><f:selectItem itemValue="#{null}" itemLabel="Нет"/><f:selectItems value="#{dragonBean.colors}"/></h:selectOneMenu><h:outputText value="X"/><h:inputText value="#{dragonBean.person.location.x}" required="true"/><h:outputText value="Y"/><h:inputText value="#{dragonBean.person.location.y}"/><h:outputText value="Z"/><h:inputText value="#{dragonBean.person.location.z}"/><h:outputText value="Вес"/><h:inputText value="#{dragonBean.person.weight}" required="true"/><h:outputText value="Страна"/><h:selectOneMenu value="#{dragonBean.person.nationality}" required="true"><f:selectItems value="#{dragonBean.countries}"/></h:selectOneMenu></h:panelGrid><h:commandButton value="Создать" action="#{dragonBean.addPerson}"/></h:form></h:body></html>
