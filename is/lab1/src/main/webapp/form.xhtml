<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head><title>Дракон</title></h:head><h:body><h1>Дракон</h1><h:link value="К списку" outcome="index.xhtml"/> | <h:link value="Добавить пещеру или человека" outcome="helpers.xhtml"/><h:messages style="color:red"/>
<h:form><h:panelGrid columns="2">
<h:outputText value="Имя"/><h:inputText value="#{dragonBean.dragon.name}" required="true" requiredMessage="Укажите имя"/>
<h:outputText value="X (до 689)"/><h:inputText value="#{dragonBean.dragon.coordinates.x}" required="true"/>
<h:outputText value="Y (до 310)"/><h:inputText value="#{dragonBean.dragon.coordinates.y}" required="true"/>
<h:outputText value="Пещера"/><h:selectOneMenu value="#{dragonBean.caveId}" required="true" requiredMessage="Выберите пещеру"><f:selectItem itemValue="#{null}" itemLabel="Выберите"/><f:selectItems value="#{dragonBean.caves}" var="c" itemValue="#{c.id}" itemLabel="#{c.id} (сокровища: #{c.numberOfTreasures})"/></h:selectOneMenu>
<h:outputText value="Убийца"/><h:selectOneMenu value="#{dragonBean.killerId}"><f:selectItem itemValue="#{null}" itemLabel="Нет"/><f:selectItems value="#{dragonBean.people}" var="p" itemValue="#{p.id}" itemLabel="#{p.name}"/></h:selectOneMenu>
<h:outputText value="Возраст"/><h:inputText value="#{dragonBean.dragon.age}"/>
<h:outputText value="Размах крыльев"/><h:inputText value="#{dragonBean.dragon.wingspan}" required="true"/>
<h:outputText value="Вес"/><h:inputText value="#{dragonBean.dragon.weight}" required="true"/>
<h:outputText value="Цвет"/><h:selectOneMenu value="#{dragonBean.dragon.color}"><f:selectItem itemValue="#{null}" itemLabel="Нет"/><f:selectItems value="#{dragonBean.colors}"/></h:selectOneMenu>
<h:outputText value="Размер головы"/><h:inputText value="#{dragonBean.dragon.head.size}"/>
</h:panelGrid><h:commandButton value="Сохранить" action="#{dragonBean.save}"/></h:form></h:body></html>
