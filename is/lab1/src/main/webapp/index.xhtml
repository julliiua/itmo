<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html" xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head><title>Драконы</title><meta http-equiv="refresh" content="5"/></h:head>
<h:body>
<h1>Драконы</h1>
<h:form><h:commandLink value="Новый дракон" action="#{dragonBean.create}"/> | <h:link value="Пещеры и люди" outcome="helpers.xhtml"/> | <h:link value="Специальные операции" outcome="special.xhtml"/></h:form>
<h:messages style="color:red"/>
<h:form><h:outputLabel value="Фильтр: "/><h:selectOneMenu value="#{dragonBean.column}"><f:selectItem itemValue="name" itemLabel="Имя"/><f:selectItem itemValue="color" itemLabel="Цвет"/><f:selectItem itemValue="killer" itemLabel="Убийца"/></h:selectOneMenu><h:inputText value="#{dragonBean.text}"/><h:outputLabel value=" Сортировать: "/><h:selectOneMenu value="#{dragonBean.order}"><f:selectItem itemValue="id" itemLabel="ID"/><f:selectItem itemValue="name" itemLabel="Имя"/><f:selectItem itemValue="color" itemLabel="Цвет"/><f:selectItem itemValue="killer" itemLabel="Убийца"/></h:selectOneMenu><h:commandButton value="Показать" action="#{dragonBean.filter}"/></h:form>
<h:form><h:dataTable value="#{dragonBean.rows}" var="d" border="1" cellpadding="6">
<h:column><f:facet name="header">ID</f:facet>#{d.id}</h:column>
<h:column><f:facet name="header">Имя</f:facet>#{d.name}</h:column>
<h:column><f:facet name="header">X</f:facet>#{d.coordinates.x}</h:column>
<h:column><f:facet name="header">Y</f:facet>#{d.coordinates.y}</h:column>
<h:column><f:facet name="header">Создан</f:facet>#{d.creationDate}</h:column>
<h:column><f:facet name="header">Пещера</f:facet>#{d.cave.id}</h:column>
<h:column><f:facet name="header">Убийца</f:facet>#{d.killer.name}</h:column>
<h:column><f:facet name="header">Возраст</f:facet>#{d.age}</h:column>
<h:column><f:facet name="header">Размах</f:facet>#{d.wingspan}</h:column>
<h:column><f:facet name="header">Вес</f:facet>#{d.weight}</h:column>
<h:column><f:facet name="header">Цвет</f:facet>#{d.color}</h:column>
<h:column><f:facet name="header">Голова</f:facet>#{d.head.size}</h:column>
<h:column><f:facet name="header">Жив</f:facet>#{d.alive}</h:column>
<h:column><h:commandLink value="Открыть" action="#{dragonBean.show(d.id)}"/> | <h:commandLink value="Изменить" action="#{dragonBean.edit(d.id)}"/> | <h:commandLink value="Удалить" action="#{dragonBean.delete(d.id)}"/></h:column>
</h:dataTable><h:commandButton value="Назад" action="#{dragonBean.back}" disabled="#{not dragonBean.previous}"/><h:outputText value=" Страница #{dragonBean.page + 1} "/><h:commandButton value="Далее" action="#{dragonBean.next}" disabled="#{not dragonBean.next}"/></h:form>
</h:body></html>
