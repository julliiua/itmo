services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dragon_local
      POSTGRES_USER: dragon
      POSTGRES_PASSWORD: dragon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dragon -d dragon_local"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - dragon_data:/var/lib/postgresql/data
  app:
    image: quay.io/wildfly/wildfly:26.1.3.Final-jdk17
    ports:
      - "18080:8080"
    environment:
      DB_HOST: db
      DB_NAME: dragon_local
      DB_USER: dragon
      DB_PASSWORD: dragon
    volumes:
      - ./target/is_lab1.war:/opt/jboss/wildfly/standalone/deployments/is_lab1.war:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  dragon_data:
